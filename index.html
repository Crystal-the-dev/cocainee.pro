<!DOCTYPE html>
<html lang="en">
<head>
    
    <!-- Who even reads this code?-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocainee.pro - Terms</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #161616;
            background: #f5f5f5;
        }

        body {
            box-sizing: border-box;
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-content: center;
            gap: 18px;
            padding: 24px;
            text-align: center;
        }

        body * {
            box-sizing: inherit;
        }

        h1 {
            max-width: 680px;
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
        }

        a {
            color: #1558a6;
        }

        button {
            margin: 0 4px;
            padding: 10px 18px;
            border: 1px solid #888;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: #e9e9e9;
        }

        #jumpscare {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: none;
            overflow: hidden;
            background: #000;
        }

        #jumpscare.visible {
            display: block;
        }

        #jumpscare-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>Hello, Cocainee.pro uses cookies please accept them to continue</h1>
    <a href="">Privacy Policy</a> <a href="">Terms of Service</a>
    <div>
        <button type="button" data-jumpscare>Accept</button>
        <button type="button" data-jumpscare>Decline</button>
    </div>

    <div id="jumpscare" role="dialog" aria-label="Jumpscare" aria-hidden="true">
        <img id="jumpscare-image" src="jumpscare.jpg" alt="">
        <audio id="jumpscare-audio" src="jumpscare.mp3" preload="auto"></audio>
    </div>

    <script>
        const jumpscare = document.querySelector('#jumpscare');
        const jumpscareAudio = document.querySelector('#jumpscare-audio');
        let reloadWarningEnabled = true;

        window.addEventListener('beforeunload', (event) => {
            if (!reloadWarningEnabled) {
                return;
            }

            event.preventDefault();
            event.returnValue = '';
        });

        async function showJumpscare() {
            jumpscare.classList.add('visible');
            jumpscare.setAttribute('aria-hidden', 'false');

            try {
                await document.documentElement.requestFullscreen();
            } catch (error) {
                
            }

            jumpscareAudio.currentTime = 0;
            jumpscareAudio.play().catch(() => {});

            window.setTimeout(() => window.location.reload(), 500);
        }

        document.querySelectorAll('[data-jumpscare]').forEach((button) => {
            button.addEventListener('click', showJumpscare);
        });
    </script>

    <!-- Who even reads this code?-->
</body>
</html>
